name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  LOCALIZE_DEFAULT_LOCALE: en

permissions:
  contents: read

jobs:
  test:
    name: "Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}${{ matrix.lint && ' (lint)' || '' }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Every row pins the latest patch of its Elixir minor and its OTP
          # major, verified against the release tags. Bump every row that
          # uses a version in the same change, never one at a time.

          # Elixir 1.17 — supports OTP 25–27
          - elixir: "1.17.3-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.17.3-otp-27"
            otp: "27.3.4.19"

          # Elixir 1.18 — supports OTP 25–27
          - elixir: "1.18.6-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.18.6-otp-27"
            otp: "27.3.4.19"

          # Elixir 1.19 — supports OTP 26–28
          - elixir: "1.19.7-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.19.7-otp-27"
            otp: "27.3.4.19"
          - elixir: "1.19.7-otp-28"
            otp: "28.5.0.8"

          # Elixir 1.20 — supports OTP 27–29
          - elixir: "1.20.5-otp-27"
            otp: "27.3.4.19"
          - elixir: "1.20.5-otp-28"
            otp: "28.5.0.8"
          - elixir: "1.20.5-otp-29"
            otp: "29.1.2"
            lint: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      # Astro ships a compact JPL ephemeris for 1900-2100 in its hex package and
      # answers other dates from analytical series, so nothing is downloaded:
      # the tests run on the same kernel every hex install has.

      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted

      - name: Run credo
        if: matrix.lint
        run: mix credo --strict

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # Coverage instrumentation is broken on OTP 27: cover's
      # line-counter transform of `x in @module_attribute` guards is
      # rejected by OTP 27's compile:forms as an unsafe variable
      # (works on OTP 26, 28 and 29). Coverage is a code metric, not
      # a per-toolchain property, so the threshold gate runs once on
      # the canonical lint toolchain and the rest of the matrix runs
      # the plain suite.
      - name: Run tests
        if: ${{ !matrix.lint }}
        run: mix test

      # The lint entry also runs the :full-tagged exhaustive sweeps
      # (excluded from default runs in test_helper.exs) so the
      # lunisolar round-trip canaries still gate every push.
      - name: Run tests with coverage threshold
        if: matrix.lint
        run: mix test --cover --include full

      - name: Restore PLT cache
        if: matrix.lint
        uses: actions/cache@v6
        with:
          path: _build/dev/dialyxir_*
          key: plt-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Run dialyzer
        if: matrix.lint
        env:
          MIX_ENV: dev
        run: mix dialyzer

      - name: Check docs
        if: matrix.lint
        env:
          MIX_ENV: release
        run: mix docs --warnings-as-errors
